name: Validate
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@0c1592977591ecba077a4666d699840062711201 # reviewed shared standards
    with:
      hassfest-core-ref: ec18d8b25d1ee39aa8b85a72a170e42bee33228c
  standards:
    name: Central template compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    # Replace main with the reviewed full standards SHA during adoption.
    - uses: eigger/hass-repo-standards/actions/check-standards@0c1592977591ecba077a4666d699840062711201
