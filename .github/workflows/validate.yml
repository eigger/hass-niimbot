name: Validate
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@v1.1.5 # reviewed shared standards release
    with:
      hassfest-core-ref: ec18d8b25d1ee39aa8b85a72a170e42bee33228c
