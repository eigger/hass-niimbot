name: Tests
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.1 # reviewed shared standards release
    with:
      standards-ref: c9b4553184f9c27bdbe7bf8564eaf10153e9575b
      domain: niimbot
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession", "imagespec"]'
      ha-components: bluetooth bluetooth_adapters recorder
      pytest-args: tests/components/niimbot/ -v --timeout 120
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.1 # reviewed shared standards release
    with:
      standards-ref: c9b4553184f9c27bdbe7bf8564eaf10153e9575b
      domain: niimbot
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.1.0'
      test-profile: ha
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession", "imagespec"]'
      ha-components: bluetooth bluetooth_adapters recorder
      pytest-args: tests/components/niimbot/ -v --timeout 120
