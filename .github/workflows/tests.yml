name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@7acd9cab6ac774e4695f2c962e3d88b5faa4620d # reviewed shared standards
    with:
      domain: niimbot
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession", "imagespec"]'
      ha-components: bluetooth bluetooth_adapters recorder
      pytest-args: tests/components/niimbot/ -v --timeout 120
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@7acd9cab6ac774e4695f2c962e3d88b5faa4620d # reviewed shared standards
    with:
      domain: niimbot
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.1.0'
      test-profile: ha
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession", "imagespec"]'
      ha-components: bluetooth bluetooth_adapters recorder
      pytest-args: tests/components/niimbot/ -v --timeout 120
