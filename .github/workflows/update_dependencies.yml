name: Update dependencies
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@648dad941a118c80325f44c7a13cb5b5b9c1c788 # reviewed shared standards
    with:
      standards-ref: 648dad941a118c80325f44c7a13cb5b5b9c1c788
      domain: niimbot
      packages: '["imagespec", "blesession"]'
      python-version: '3.14'
      test-profile: ha
      ha-components: bluetooth bluetooth_adapters recorder
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/niimbot/ -v --timeout 120
