# Enable Fetch Label Info Online to use the loaded label's size after lookup.
action: niimbot.print
target:
  device_id: <your device>
data:
  payload:
    - type: text
      value: Hello World!
      x: 10
      y: 10
      size: 28
    - type: qrcode
      data: "https://www.home-assistant.io"
      x: 230
      y: 10
      width: 80
      height: 80
